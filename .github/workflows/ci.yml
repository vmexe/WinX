name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish the built WinX.exe as a GitHub release under this tag (e.g. v1.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------
  # The self-test exercises the whole engine: apply, verify, undo, plus
  # every enumeration module. On Windows it runs live; on Linux it runs
  # the same code through simulation mode.
  # ---------------------------------------------------------------------
  selftest:
    name: Self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Catches broken intra-package imports in modules CI cannot import
      # headlessly (the whole UI layer needs the Qt runtime).
      - name: Check intra-package imports
        run: python tools/check_imports.py

      # Qt is usable on the Windows runner, so actually import every module
      # there — including the GUI layer the self-test never touches.
      - name: Import every module
        if: runner.os == 'Windows'
        run: >
          python -c "import importlib, pkgutil, winx;
          mods=[m.name for m in pkgutil.walk_packages(winx.__path__, 'winx.')];
          [importlib.import_module(m) for m in mods];
          print(f'imported {len(mods)} modules')"

      # Measures how long the GUI thread is blocked by building the window,
      # polling the dashboard meters and opening each page.
      - name: Check UI responsiveness
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/uicheck.py

      - name: Run the self-test
        id: selftest
        shell: bash
        run: |
          set +e
          python main.py --selftest > selftest.txt 2>&1
          code=$?
          cat selftest.txt
          exit $code

      # Posted on failure so a broken matrix job can be diagnosed from the
      # conversation even when the job log cannot be downloaded.
      - name: Post self-test output to the PR
        if: always() && steps.selftest.outcome == 'failure' && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python tools/post_ci_output.py selftest.txt "${{ matrix.os }}"

  # ---------------------------------------------------------------------
  # Builds the single-file GUI executable.
  # ---------------------------------------------------------------------
  build:
    name: Build WinX.exe
    needs: selftest
    runs-on: windows-latest
    # The release step needs to be able to create tags/releases.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.3"

      - name: Generate the application icon
        run: python tools/make_icon.py

      - name: Build with PyInstaller
        id: build
        shell: bash
        run: |
          set +e
          pyinstaller build/WinX.spec --noconfirm --clean > build.log 2>&1
          code=$?
          cat build.log
          exit $code

      - name: Post build log to the PR
        if: always() && steps.build.outcome == 'failure' && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python tools/post_ci_output.py build.log "build (windows-latest)"

      # Imports the entire app, GUI layer included, inside the frozen exe.
      # Must fail the build: a missing module only shows up here.
      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $out = & ./dist/WinX.exe --version 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "WinX.exe --version exited $LASTEXITCODE" }
          if ($out -notmatch 'WinX') { throw "unexpected --version output" }

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist/WinX.exe release/
          Copy-Item README.md, LICENSE release/
          Compress-Archive -Path release/* -DestinationPath WinX-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WinX-Windows-x64
          path: |
            dist/WinX.exe
            WinX-Windows-x64.zip
          if-no-files-found: error

      # Publishes the executable to GitHub Releases, either from a pushed
      # v* tag or from a manual run where a release tag was supplied.
      - name: Attach the build to the release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: WinX ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/WinX.exe
            WinX-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
